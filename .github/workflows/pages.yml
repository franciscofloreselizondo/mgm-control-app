name: Publicar app en GitHub Pages
on:
  push: { branches: [main], paths: ['web/**'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A veces GitHub falla al encontrar el paquete recién subido: se espera y se reintenta una vez.
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: d
        run: echo "page_url=${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
